name: brewlite_local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can_thiet_lap_POSTGRES_PASSWORD_trong_.env}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/dbBrewLite.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brewlite_local}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Can_thiet_lap_JWT_SECRET_trong_.env}
      FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:3100,http://127.0.0.1:3100}
      PORT: "4000"
      ENABLE_DEMO_PAYMENTS: ${ENABLE_DEMO_PAYMENTS:-false}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-}
      ZALOPAY_CREATE_URL: ${ZALOPAY_CREATE_URL:-https://sb-openapi.zalopay.vn/v2/create}
      ZALOPAY_QUERY_URL: ${ZALOPAY_QUERY_URL:-https://sb-openapi.zalopay.vn/v2/query}
      # Không khai báo: local vẫn tạo QR; QueryDR tự xác minh khi callback không đến.
      # Có HTTPS tunnel riêng thì đặt ZALOPAY_LOCAL_CALLBACK_URL trong .env.
      ZALOPAY_CALLBACK_URL: ${ZALOPAY_LOCAL_CALLBACK_URL:-}
      ZALOPAY_AUTO_RECONCILE: ${ZALOPAY_AUTO_RECONCILE:-true}
      # Local DB riêng: chặn cấu hình callback nhầm sang Backend Render.
      ZALOPAY_LOCAL_MODE: 'true'
      # Tùy chọn: Frontend HTTPS tunnel cho thiết bị di động quay lại sau thanh toán.
      ZALOPAY_RETURN_ORIGIN: ${ZALOPAY_RETURN_ORIGIN:-}
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4100}
        NEXT_PUBLIC_ENABLE_DEMO_PAYMENTS: ${NEXT_PUBLIC_ENABLE_DEMO_PAYMENTS:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
